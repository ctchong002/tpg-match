<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TPG Residential Finder</title>
<meta name="description" content="Johor Bahru residential listings: apartments, terrace, semi-D and bungalows for sale or rent">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Residential Finder">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="../assets/listings.css">
<style>
/* page-local: .chips{display:flex} would otherwise override the hidden attribute */
.chips[hidden]{display:none!important}
#chips-ld,#chips-hr{margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>TPG Residential Finder</h1>
  <div class="sub" id="cover">Loading…</div>
</header>
<div class="fp" id="panel"><div>
  <div class="fp-top">
  <div class="search-row"><div class="search"><span class="ico">🔍</span><input id="q" type="search" placeholder="Search area / project" enterkeyhint="search" autocomplete="off"></div><button type="button" class="filt-toggle" id="filt-toggle" aria-expanded="false">Filters</button></div>
  <div class="tabs" id="sr">
    <button type="button" data-v="" class="on">All</button>
    <button type="button" data-v="s">Buy</button>
    <button type="button" data-v="r">Rent</button>
  </div>
  <div class="sticky-chips" id="sticky-chips"></div>
  </div>
  <div class="filt-body" id="filt-body">
  <h2>Property Type</h2>
  <div class="tiles" id="cat">
    <button type="button" class="all on" data-v="">All Types <small id="n-all"></small></button>
    <button type="button" class="tile" data-v="ld"><span class="ic">🏠</span>Landed<small id="n-ld"></small></button>
    <button type="button" class="tile" data-v="hr"><span class="ic">🏢</span>Highrise<small id="n-hr"></small></button>
  </div>
  <div class="chips" id="chips-ld" hidden>
    <button type="button" class="chip" data-v="lmc">Low Medium Cost</button>
    <button type="button" class="chip" data-v="terrace">Terrace</button>
    <button type="button" class="chip" data-v="cluster">Cluster</button>
    <button type="button" class="chip" data-v="semi">Semi-D</button>
    <button type="button" class="chip" data-v="bung">Bungalow</button>
  </div>
  <div class="chips" id="chips-hr" hidden>
    <button type="button" class="chip" data-v="lmc">Low Medium Cost</button>
    <button type="button" class="chip" data-v="apt">Apartment</button>
    <button type="button" class="chip" data-v="townhouse">Townhouse</button>
  </div>

  <h2>Price (RM) <small>Rent is monthly</small></h2>
  <div class="mm"><input id="minP" type="number" inputmode="numeric" placeholder="Min" aria-label="Min"><span class="dash">–</span><input id="maxP" type="number" inputmode="numeric" placeholder="Max" aria-label="Max"></div>

  <h2>More Filters</h2>
  <div class="sec" data-k="ar"><button type="button" class="sh">Area<span class="sv"></span><span class="ar">▼</span></button><div class="sb"><div class="chips" id="areas"></div></div></div>
  <div class="sec" data-k="bu"><button type="button" class="sh">Built-up (sf)<span class="sv"></span><span class="ar">▼</span></button><div class="sb"><div class="mm"><input id="bumin" type="number" inputmode="numeric" placeholder="Min" aria-label="Min"><span class="dash">–</span><input id="bumax" type="number" inputmode="numeric" placeholder="Max" aria-label="Max"></div></div></div>
  <div class="sec" data-k="ld"><button type="button" class="sh">Land Area (sf)<span class="sv"></span><span class="ar">▼</span></button><div class="sb"><div class="mm"><input id="landmin" type="number" inputmode="numeric" placeholder="Min" aria-label="Min"><span class="dash">–</span><input id="landmax" type="number" inputmode="numeric" placeholder="Max" aria-label="Max"></div></div></div>
  <div class="sec" data-k="beds"><button type="button" class="sh">Bedrooms<span class="sv"></span><span class="ar">▼</span></button><div class="sb"><div class="chips" id="beds">
    <button type="button" class="chip" data-v="0">Studio+</button>
    <button type="button" class="chip" data-v="1">1+</button>
    <button type="button" class="chip" data-v="2">2+</button>
    <button type="button" class="chip" data-v="3">3+</button>
    <button type="button" class="chip" data-v="4">4+</button>
    <button type="button" class="chip" data-v="5">5+</button>
  </div></div></div>
  <div class="sec" data-k="ten"><button type="button" class="sh">Tenure<span class="sv"></span><span class="ar">▼</span></button><div class="sb"><div class="fld"><select id="ten"><option value="">Any</option><option value="FH">Freehold</option><option value="LH">Leasehold</option></select></div></div></div>
  <div class="sec" data-k="kw"><button type="button" class="sh">Keywords<span class="sv"></span><span class="ar">▼</span></button><div class="sb"><div class="fld"><input id="kw" type="search" placeholder="e.g. corner, renovated" autocomplete="off"></div><div class="hint">All words must appear in the original post.</div></div></div>
  <div class="sec" data-k="furn"><button type="button" class="sh">Furnishing<span class="sv"></span><span class="ar">▼</span></button><div class="sb"><div class="fld"><select id="furn"><option value="">Any</option><option value="F">Fully Furnished</option><option value="P">Partly Furnished</option><option value="B">Bare</option></select></div></div></div>
  <div class="sec" data-k="bumi"><button type="button" class="sh">Bumi / Non Bumi<span class="sv"></span><span class="ar">▼</span></button><div class="sb"><div class="fld"><select id="bumi"><option value="">Any</option><option value="N">Non-Bumi</option><option value="B">Bumi</option></select></div></div></div>
  <div class="sec" data-k="gr"><button type="button" class="sh">Source Group<span class="sv"></span><span class="ar">▼</span></button><div class="sb"><div class="chips" id="groups"></div></div></div>

  <div class="acts"><button type="button" id="reset">Reset</button><button type="button" class="pri" id="go">Show Results</button></div>
  </div>
</div></div>
<div id="info"><span id="cnt">Loading…</span>
  <select id="sort" aria-label="Sort">
    <option value="n">Newest</option>
    <option value="p">Price: Low to High</option>
    <option value="pd">Price: High to Low</option>
    <option value="psf">psf: Low to High</option>
    <option value="bu">Built-up: Large to Small</option>
    <option value="ld">Land Area: Large to Small</option>
  </select>
</div>
<div id="list"></div>
<button id="more" type="button" hidden>Show More</button>
<footer id="foot"></footer>

<script type="text/plain" id="app">
(function(){
var D=window.RES,L=D.L,$=function(i){return document.getElementById(i)},tmr,shown=0,res=[];
var BASE=Date.UTC(2026,0,1);
function dstr(d){var x=new Date(BASE+d*864e5);return x.getUTCDate()+"/"+(x.getUTCMonth()+1)+"/"+String(x.getUTCFullYear()).slice(2)}
var TY=D.types,APT={0:1,1:1,2:1,3:1,4:1,5:1,6:1},HR={0:1,1:1,2:1,3:1,4:1,5:1,6:1,11:1},LD={7:1,8:1,9:1,10:1,12:1};
var TZH={"condo":"Condo","serviced apartment":"Serviced Apt","apartment":"Apartment","flat":"Flat","penthouse":"Penthouse","duplex/loft":"Duplex/Loft","highrise (unspecified)":"Highrise","terrace":"Terrace","cluster":"Cluster","semi-D":"Semi-D","bungalow":"Bungalow","townhouse":"Townhouse","residential land":"Residential Land","room":"Room","":"Residential"};
var AC={};L.forEach(function(r){(r[27]&&r[27].length?r[27]:[r[17]]).forEach(function(i){AC[i]=(AC[i]||0)+1})});
var areaList=D.areas.map(function(a,i){return {i:i,a:a,n:AC[i]||0}}).filter(function(x){return x.n>=5}).sort(function(a,b){return b.n-a.n});
areaList.forEach(function(x){var b=document.createElement("button");b.type="button";b.className="chip";b.dataset.v=String(x.i);b.textContent=x.a+" "+x.n;$("areas").appendChild(b)});
D.groups.forEach(function(g,i){var b=document.createElement("button");b.type="button";b.className="chip";b.dataset.v=String(i);b.textContent=g;$("groups").appendChild(b)});
function fmtN(n){return Math.round(n).toLocaleString("en-US")}
function srN(pred){var s=0,r=0;L.forEach(function(x){if(!pred(x))return;if(x[1]==="S"||x[1]==="B")s++;if(x[1]==="R"||x[1]==="B")r++});return "Sale "+fmtN(s)+" · Rent "+fmtN(r)}
$("n-all").textContent=fmtN(L.length)+" · "+srN(function(){return true});
$("n-ld").textContent=fmtN(L.filter(function(x){return LD[x[2]]}).length)+" · "+srN(function(x){return LD[x[2]]});
$("n-hr").textContent=fmtN(L.filter(function(x){return HR[x[2]]}).length)+" · "+srN(function(x){return HR[x[2]]});
$("cover").textContent=D.meta.since.split("-").reverse().join("/")+" – "+(D.meta.last||"").split("-").reverse().join("/")+" · "+fmtN(D.meta.n)+" listings · Updated "+(D.meta.updated||"").slice(0,10);
$("foot").innerHTML="Listings are from WhatsApp groups, for reference only. Please verify with the agent.<br>The Roof Realty / The Pillars Group · CT Chong · Updated "+D.meta.updated;

function money(s){if(!s)return 0;s=String(s).toLowerCase().replace(/[,rm\s]/g,"");var m=s.match(/^([\d.]+)(k|m|mil|万)?$/);if(!m)return 0;var v=parseFloat(m[1]);return m[2]==="k"?v*1e3:(m[2]==="m"||m[2]==="mil")?v*1e6:m[2]==="万"?v*1e4:v}
function on(id){return [].filter.call($(id).children,function(c){return c.classList.contains("on")&&c.dataset.v!==undefined&&c.dataset.v!==""}).map(function(c){return c.dataset.v})}
function tabSR(){var b=$("sr").querySelector("button.on");var v=b&&b.dataset.v;return v==="s"?"S":v==="r"?"R":""}
function famNow(){var t=$("cat").querySelector(".tile.on");return t?t.dataset.v:""}
function price(r,sr){return sr==="R"?r[15]:sr==="S"?r[14]:(r[14]||r[15])}
function isLmc(r){return !!(window.LMC&&window.LMC[r[0]])}
function typeOk(r){
  var fam=famNow();
  if(!fam)return true;
  var landed=!!LD[r[2]], high=!!HR[r[2]];
  if(fam==="ld"&&high)return false;
  if(fam==="hr"&&landed)return false;
  var box=fam==="ld"?$("chips-ld"):$("chips-hr");
  var chips=on(box.id);
  var wantLmc=chips.indexOf("lmc")>=0;
  var structs=chips.filter(function(v){return v!=="lmc"});
  if(wantLmc&&!isLmc(r))return false;
  if(!chips.length||(!structs.length&&wantLmc)){
    if(fam==="ld")return landed||(wantLmc&&isLmc(r)&&!high);
    return high||(wantLmc&&isLmc(r)&&!landed);
  }
  if(fam==="ld"&&!landed)return false;
  if(fam==="hr"&&!high)return false;
  var t=TY[r[2]];
  for(var i=0;i<structs.length;i++){
    var v=structs[i];
    if(v==="terrace"&&t==="terrace")return true;
    if(v==="cluster"&&t==="cluster")return true;
    if(v==="semi"&&t==="semi-D")return true;
    if(v==="bung"&&t==="bungalow")return true;
    if(v==="apt"&&APT[r[2]])return true;
    if(v==="townhouse"&&t==="townhouse")return true;
  }
  return false;
}
var ABBR={tmn:"taman",tman:"taman",jln:"jalan",jaln:"jalan",bdr:"bandar",bndr:"bandar",kg:"kampung",kpg:"kampung",btk:"bukit",jj:"johor jaya",bkt:"bukit"};
function norm(s){return " "+String(s||"").toLowerCase().replace(/[\u2018\u2019']/g,"").replace(/[^a-z0-9\u4e00-\u9fff]+/g," ").split(" ").filter(Boolean).map(function(w){return ABBR[w]||w}).join(" ")+" "}
function qphrases(q){return q.split(/[,;，；]+/).map(function(x){return norm(x)}).filter(function(x){return x.trim()})}
function tagNames(r){return (r[27]&&r[27].length?r[27]:[r[17]]).map(function(i){return D.areas[i]||""}).filter(Boolean)}
function fieldHay(r){if(r.nf===undefined){var ag=D.agents[r[19]];r.nproj=norm(r[18])+"|"+tagNames(r).map(norm).join("|");r.nf=r.nproj+"|"+norm(ag[0])+"|"+norm(ag[1])+"|"+norm(r[0]);r.nk=norm(r[25])}return r}
function phraseHit(h,ph){return h.indexOf(ph)>=0}
var rawNorm={};
var NB_RX=/(^|[^a-z])(?:nearby|near\s*by|near(?:est)?(?:\s+to)?|close\s+to|closed\s+to|next\s+to|beside|opposite|opp\.?|adjacent(?:\s+to)?|adjoining|surrounded?\s+by|surroundings?|walking\s+distance|walk(?:able)?\s+to|steps?\s+to|(?:easy\s+)?access\s+to|minutes?\s+(?:to|from|away|drive|walk)|mins?\s+(?:to|from|away|drive|walk)|\d+(?:\.\d+)?\s*(?:km|kilometers?|mins?|minutes?)(?![a-z])|just\s+\d+\s*(?:min|km)|drive\s+to|view\s+of|close\s+by)(?![a-z])|附近|靠近|旁边|隔壁|对面|步行|距离|分钟|公里|周边|周围|邻近|临近|紧邻|毗邻/i,NB_HEAD=/^[^A-Za-z0-9\u4e00-\u9fff]*(?:nearby|near\s*by|near|surroundings?|around|facilities|amenities|distance|附近|周边|周围|附近设施|生活配套|配套)(?:\s+(?:amenities|facilities|places|place|attractions|landmarks|area|areas|convenience|location|info|information|of interest|around|the area|设施|地点))*[^A-Za-z0-9\u4e00-\u9fff]*(?:[:：][^\n]{0,40})?$/i,NB_STOP=/\brm\s?\d|\d\s?(?:k|mil)\b|for\s*sale|for\s*rent|\bbed|\bbath|sq\s?ft|\bsqf|freehold|leasehold|furnish|wa\.me|wasap|\+?60\d{8}|tenure|出售|出租|售价|租金/i,NB_AMEN=/\baeon\b|\blotus'?s?\b|\bgiant\b|\bmydin\b|econsave|hospital|\bschools?\b|sekolah|\bcollege\b|\bmall\b|商场|超市|学校|医院|\btesco\b|\bsupermarket\b|\bsmk\b|\bsjk\b|\bmrt\b|\blrt\b|\bkfc\b|\bmcd\b|\bpetronas\b|\bhighway\b|\blebuhraya\b|\bsingapore\b|\bcustoms\b/i;
function stripNearby(t){var out=[],skip=false,ns=0,idx=0,ls=String(t).split("\n");
  for(var i=0;i<ls.length;i++){var l=ls[i];
    if(skip){if(!l.trim()&&ns===0)continue;if(!l.trim()||NB_STOP.test(l)||ns>=14)skip=false;else{ns++;continue}}
    if(l.trim()&&NB_HEAD.test(l.trim())){skip=true;ns=0;continue}
    if(l.trim())idx++;
    var m=NB_RX.exec(l);
    if(m){l=l.slice(0,m.index+(m[1]?m[1].length:0)).replace(/[\s\-–—:：,;|@(（\[]+$/,"");if(!/[A-Za-z\u4e00-\u9fff]/.test(l))continue}
    else if(idx>4&&NB_AMEN.test(l)&&!NB_STOP.test(l))continue;
    out.push(l)}
  return out.join("\n")}
function rawHay(r){var i=IDX[r[0]];if(!window.RAW)return null;if(rawNorm[i]===undefined)rawNorm[i]=norm(stripNearby(window.RAW[i]||""));return rawNorm[i]}
var CURSR="";

function bedMin(){var vs=on("beds").map(Number);return vs.length?Math.max.apply(null,vs):-1}
function setSec(k,text,on){var sec=document.querySelector('.sec[data-k="'+k+'"]');if(!sec)return;sec.querySelector(".sv").textContent=text||"Any";sec.classList.toggle("act",!!on)}
function summaries(){
  var ar=on("areas"),gr=on("groups"),bu=[],ld=[];
  setSec("ar",ar.length?ar.length+" selected":"Any",ar.length);
  if($("bumin").value)bu.push("min "+$("bumin").value);if($("bumax").value)bu.push("max "+$("bumax").value);
  setSec("bu",bu.length?bu.join(" – "):"Any",bu.length);
  if($("landmin").value)ld.push("min "+$("landmin").value);if($("landmax").value)ld.push("max "+$("landmax").value);
  setSec("ld",ld.length?ld.join(" – "):"Any",ld.length);
  var bd=on("beds");
  setSec("beds",bd.length?bd.map(function(v){return v==="0"?"Studio+":v+"+"}).join(", "):"Any",bd.length);
  var te=$("ten").value,fu=$("furn").value,bm=$("bumi").value,kw=$("kw").value.trim();
  setSec("ten",te==="FH"?"Freehold":te==="LH"?"Leasehold":"Any",!!te);
  setSec("kw",kw||"Any",!!kw);
  setSec("furn",{F:"Fully",P:"Partly",B:"Bare"}[fu]||"Any",!!fu);
  setSec("bumi",bm==="N"?"Non-Bumi":bm==="B"?"Bumi":"Any",!!bm);
  setSec("gr",gr.length?gr.length+" selected":"Any",gr.length);
}
function applySearch(list,q){
  var words=qphrases(q);
  if(!words.length){list.forEach(function(r){r.rk=0});return list}
  var st1=list.filter(function(r){fieldHay(r);return words.every(function(ph){return phraseHit(r.nf,ph)||phraseHit(r.nk,ph)})});
  if(st1.length){st1.forEach(function(r){r.rk=words.every(function(ph){return phraseHit(r.nproj,ph)})?0:1});return st1}
  if(window.RAW){var st2=list.filter(function(r){var h=rawHay(r);return h&&words.every(function(ph){return phraseHit(h,ph)})});st2.forEach(function(r){r.rk=0});return st2}
  loadRaw(function(){run()});
  return [];
}
function stickyChips(){
  var el=$("sticky-chips");if(!el)return;
  var bits=[],sr=tabSR(),q=$("q").value.trim();
  if(sr==="R")bits.push("Rent");else if(sr==="S")bits.push("Buy");
  var cb=$("cat").querySelector(".on");
  if(cb&&cb.dataset.v){var lab=cb.textContent.replace(/\s+/g," ").trim().replace(/\d[\d,.]*.*$/,"").trim();bits.push(lab)}
  (typeof on==="function"?on("areas"):[]).slice(0,4).forEach(function(a){var n=D.areas[+a]||a;bits.push(Array.isArray(n)?n[0]||n:String(n))});
  if($("bumin").value)bits.push("BU ≥ "+$("bumin").value);
  if($("landmin").value)bits.push("Land Area ≥ "+$("landmin").value);
  if(q)bits.push(q);
  el.innerHTML=bits.map(function(x){return '<span class="chip on">'+esc(x)+"</span>"}).join("");
}
function run(){
  var q=$("q").value.trim(),kw=$("kw").value.trim(),sr=tabSR();
  var bumin=money($("bumin").value),bumax=money($("bumax").value),landmin=money($("landmin").value),landmax=money($("landmax").value);
  var pmin=money($("minP").value),pmax=money($("maxP").value),bd=bedMin(),fu=$("furn").value,te=$("ten").value,bm=$("bumi").value;
  var ar=on("areas").map(Number),gr=on("groups").map(Number);
  CURSR=sr;
  summaries();
  res=L.filter(function(r){
    if(sr&&r[1]!==sr&&r[1]!=="B")return false;
    if(!typeOk(r))return false;
    if(ar.length&&(r[27]&&r[27].length? !ar.some(function(i){return r[27].indexOf(i)>=0}):ar.indexOf(+r[17])<0))return false;
    if(bd>=0&&(r[8]<0||r[8]<bd))return false;
    if(bumin&&r[7]<bumin)return false;
    if(bumax&&(!r[7]||r[7]>bumax))return false;
    if(landmin&&r[6]<landmin)return false;
    if(landmax&&(!r[6]||r[6]>landmax))return false;
    var p=price(r,sr);
    if(pmin&&(!p||p<pmin))return false;
    if(pmax&&(!p||p>pmax))return false;
    if(fu&&r[11]!==fu)return false;
    if(te&&r[12]!==te)return false;
    if(bm&&!(bm==="B"?r[13]==="B"||r[13]==="M":r[13]===bm))return false;
    if(gr.length&&gr.indexOf(+r[21])<0&&!r[22].some(function(a){return gr.indexOf(+a[2])>=0}))return false;
    return true});
  res=applySearch(res,q);
  if(kw&&res.length)res=applySearch(res,kw);
  var s=$("sort").value;
  res.sort(function(a,b){
    if((a.rk||0)!==(b.rk||0))return (a.rk||0)-(b.rk||0);
    if(s==="n")return b[24]-a[24];
    if(s==="bu")return (b[7]||0)-(a[7]||0);
    if(s==="ld")return (b[6]||0)-(a[6]||0);
    if(s==="psf"){return (a[16]||1e9)-(b[16]||1e9)}
    var pa=price(a,sr)||(s==="pd"?0:1e12),pb=price(b,sr)||(s==="pd"?0:1e12);return s==="pd"?pb-pa:pa-pb});
  $("cnt").textContent=res.length.toLocaleString()+" listings found";
  $("go").textContent="Show "+fmtN(res.length)+" Results";
  stickyChips();save();render(false);
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmtP(v){return v>=1e6?"RM"+(v/1e6).toFixed(v%1e6?2:0).replace(/\.?0+$/,"")+"mil":"RM"+v.toLocaleString()}
function wa(ag,r){if(!ag[1])return esc(ag[0]||"?")+" <span class='small'>(no phone)</span>";
  var t=encodeURIComponent("Hi "+(ag[0]||"")+", is this unit still available? "+(r[18]||D.areas[r[17]]||"")+" "+(r[14]&&CURSR!=="R"?fmtP(r[14]):"")+(r[15]&&CURSR!=="S"?" RM"+r[15]+"/mo":""));
  return "<a href='https://wa.me/"+ag[1]+"?text="+t+"' target='_blank' rel='noopener'>"+esc(ag[0]||ag[1])+" · +"+ag[1]+" 💬</a>"}
function ico(k){
  var p={bu:'<path d="M4 20V8.5L12 4l8 4.5V20"/><path d="M9 20v-6h6v6"/>',
    land:'<path d="M4 18h16M5 18l4-10h6l4 10"/>',
    bolt:'<path d="M13 2 4 14h8l-1 8 9-12h-8l1-8z"/>',
    height:'<path d="M12 4v16M8 7l4-3 4 3M8 17l4 3 4-3"/>',
    bed:'<path d="M4 18V11h16v7M4 14h16M7 11V8h4v3"/>'};
  return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(p[k]||"")+"</svg>";
}
function isNew(r){var last=BASE+r[24]*864e5;var ref=(D.meta&&D.meta.last)?Date.parse(D.meta.last+"T00:00:00Z"):last;return (ref-last)<=3*864e5 && (ref-last)>=-864e5;}
function card(r,idx){
  var t=TY[r[2]],title=r[18]||D.areas[r[17]]||"(Unnamed project)";
  var typ=[TZH[t]||t];
  if(r[3])typ.push(r[3]+"-storey");if(r[4])typ.push(/^L/.test(r[4])?"Level "+r[4].slice(1):r[4]+" floor");if(r[5])typ.push(r[5]);
  if(r[11])typ.push({F:"Fully Furnished",P:"Partly Furnished",B:"Bare"}[r[11]]);
  if(r[12])typ.push(r[12]==="FH"?"Freehold":"Leasehold");
  if(r[13])typ.push({N:"Non-Bumi",B:"Bumi",M:"Bumi"}[r[13]]);
  var pr=[];if(r[14]&&CURSR!=="R")pr.push(fmtP(r[14])+(r[16]?" (RM"+r[16]+" psf)":""));if(r[15]&&CURSR!=="S")pr.push("Rent RM"+r[15].toLocaleString()+"/mo");
  var kind={S:"Sale",R:"Rent",B:"Rent & Sale"}[r[1]],ag=D.agents[r[19]];
  var srClass=r[1]==="R"?"rent":"sale";
  var h="<article class='card'><div class='card-top'><div class='badges'>";
  if(isNew(r))h+="<span class='badge new'>New</span>";
  if(kind)h+="<span class='badge "+srClass+"'>"+esc(kind)+"</span>";
  h+="</div><time>"+dstr(r[24])+"</time></div>";
  h+="<h3>"+esc(title)+"</h3><p class='type'>"+esc(typ.join(" · "))+"</p>";
  h+="<ul class='specs'>";
  if(r[7])h+="<li>"+ico("bu")+" <b>"+r[7].toLocaleString()+"</b>&nbsp;sf BU</li>";
  if(r[6])h+="<li>"+ico("land")+" <b>"+r[6].toLocaleString()+"</b>&nbsp;sf Land Area</li>";
  if(r[8]>=0)h+="<li>"+ico("bed")+" <b>"+esc(r[8]===0&&!r[9]?"Studio":String(r[9]||r[8]))+"</b>&nbsp;"+(r[8]===0&&!r[9]?"":" bed")+(r[10]?" · "+r[10]+" bath":"")+"</li>";
  h+="</ul>";
  h+="<div class='price-row'><span class='amt'>"+(pr[0]||"Price n/a")+"</span>"+(pr[1]?"<span class='per'>"+pr[1]+"</span>":"")+"</div>";
  if(r[26])h+="<div class='small'>Tenanted · Rent RM"+r[26].toLocaleString()+"/mo <small>(indicative rent on a sale listing)</small></div>";
  if(r[17]>=0||(r[27]&&r[27].length))h+="<div class='small'>📍 "+esc(tagNames(r).join(" · "))+"</div>";
  h+="<div class='agent'><div class='ag'>"+wa(ag,r)+"</div></div>";
  h+="<div class='small'>"+dstr(r[20])+" · "+esc(D.groups[r[21]]||"")+" · Posted "+r[23]+" times · Latest "+dstr(r[24])+" · "+r[0]+"</div>";
  if(r[22].length){h+="<details class='oth'><summary>Also posted by ("+r[22].length+")</summary>";
    r[22].forEach(function(a){var g=D.agents[a[0]];h+="<div>"+wa(g,r)+" <span class='small'>"+dstr(a[1])+" · "+esc(D.groups[a[2]]||"")+"</span></div>"});h+="</details>"}
  h+="<details class='orig'><summary>Original Post</summary><pre id='raw"+idx+"'></pre><button type='button' class='copy-orig' id='cp"+idx+"' data-i='"+idx+"'>Copy Post</button></details></article>";
  return h;
}
function render(more){var el=$("list");if(!more){el.innerHTML="";shown=0}
  var n=Math.min(res.length,shown+40),h="";for(var i=shown;i<n;i++)h+=card(res[i],i);el.insertAdjacentHTML("beforeend",h);shown=n;
  if(!res.length)el.innerHTML="<div class='empty'>No matching listings. Try widening the filters.</div>";
  var b=$("more");b.hidden=shown>=res.length;b.textContent="Show More"+(shown<res.length?" ("+(res.length-shown)+")":"");
}
var rawLoading=null;
function loadRaw(cb){if(window.RAW)return cb();if(rawLoading){rawLoading.push(cb);return}rawLoading=[cb];var s=document.createElement("script");s.src="raw.js?v="+encodeURIComponent(D.meta.updated);
  s.onload=function(){rawLoading.forEach(function(f){f()})};document.head.appendChild(s)}
var IDX={};L.forEach(function(r,i){IDX[r[0]]=i});
function fallbackCopy(t){var ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px";
  document.body.appendChild(ta);ta.focus();ta.select();try{ta.setSelectionRange(0,t.length)}catch(x){}var ok=false;try{ok=document.execCommand("copy")}catch(x){}document.body.removeChild(ta);return ok}
function copyText(t,done){var fin=false,f=function(ok){if(!fin){fin=true;done(ok)}};
  if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext){try{navigator.clipboard.writeText(t).then(function(){f(true)},function(){f(fallbackCopy(t))});setTimeout(function(){f(fallbackCopy(t))},1200)}catch(x){f(fallbackCopy(t))}}else f(fallbackCopy(t))}

$("list").addEventListener("click",function(e){
  var c=e.target.closest(".copy-orig");
  if(c){var j=+c.dataset.i,t=(window.RAW&&window.RAW[IDX[res[j][0]]])||($("raw"+j)&&$("raw"+j).textContent)||"";
    copyText(t,function(ok){c.textContent=ok?"Copied ✓":"Copy failed. Press and hold to select.";c.classList.toggle("ok",ok);if(!ok){try{var rg=document.createRange();rg.selectNodeContents($("raw"+j));var sl=getSelection();sl.removeAllRanges();sl.addRange(rg)}catch(x){}}clearTimeout(c._t);c._t=setTimeout(function(){c.textContent="Copy Post";c.classList.remove("ok")},2000)})}
});
$("list").addEventListener("toggle",function(e){
  var d=e.target.closest("details.orig");if(!d||!d.open)return;
  var pre=d.querySelector("pre");if(!pre||pre.dataset.loaded)return;

  loadRaw(function(){pre.textContent=window.RAW[IDX[res[i][0]]]||"";pre.dataset.loaded="1"});
},true);
$("more").addEventListener("click",function(){render(true)});

function showChips(){var fam=famNow();$("chips-ld").hidden=fam!=="ld";$("chips-hr").hidden=fam!=="hr"}
function save(){
  var p=[];if($("q").value)p.push("q="+encodeURIComponent($("q").value));
  if($("kw").value)p.push("kw="+encodeURIComponent($("kw").value));
  var sr=tabSR();if(sr)p.push("sr="+(sr==="S"?"s":"r"));
  var fam=famNow();if(fam)p.push("fam="+fam);
  var chips=on(fam==="hr"?"chips-hr":"chips-ld");if(fam&&chips.length)p.push("ty="+chips.join(","));
  ["minP","maxP","bumin","bumax","landmin","landmax","ten","furn","bumi"].forEach(function(k){if($(k).value)p.push(k+"="+encodeURIComponent($(k).value))});
  var bd=on("beds");if(bd.length)p.push("beds="+bd.join(","));
  var ar=on("areas");if(ar.length)p.push("ar="+ar.join(","));
  var gr=on("groups");if(gr.length)p.push("gr="+gr.join(","));
  if($("sort").value&&$("sort").value!=="n")p.push("sort="+$("sort").value);
  history.replaceState(null,"",p.length?"#"+p.join("&"):location.pathname+location.search);
}
function load(){
  var h=location.hash.slice(1);if(!h)return;
  h.split("&").forEach(function(kv){
    var i=kv.indexOf("="),k=kv.slice(0,i),v=decodeURIComponent(kv.slice(i+1));
    if(k==="q")$("q").value=v;
    else if(k==="kw")$("kw").value=v;
    else if(k==="sr"){[].forEach.call($("sr").children,function(c){c.classList.toggle("on",c.dataset.v===v)})}
    else if(k==="fam"){[].forEach.call($("cat").children,function(c){c.classList.toggle("on",c.dataset.v===v)});showChips()}
    else if(k==="ty"){var vs=v.split(","),box=famNow()==="hr"?$("chips-hr"):$("chips-ld");[].forEach.call(box.children,function(c){if(vs.indexOf(c.dataset.v)>=0)c.classList.add("on")})}
    else if(k==="beds"||k==="ar"||k==="gr"){var id={beds:"beds",ar:"areas",gr:"groups"}[k],vs=v.split(",");[].forEach.call($(id).children,function(c){if(vs.indexOf(c.dataset.v)>=0)c.classList.add("on")})}
    else if($(k))$(k).value=v;
  });
}

$("sr").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;[].forEach.call($("sr").children,function(c){c.classList.toggle("on",c===b)});run()});
$("cat").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  [].forEach.call($("cat").children,function(c){c.classList.toggle("on",c===b)});

});

["minP","maxP","bumin","bumax","landmin","landmax"].forEach(function(k){$(k).addEventListener("input",function(){clearTimeout(tmr);tmr=setTimeout(run,350)})});

$("go").addEventListener("click",function(){run();var fb=$("filt-body"),tg=$("filt-toggle");if(fb)fb.classList.remove("open");if(tg){tg.setAttribute("aria-expanded","false");tg.classList.remove("on")}var el=$("info");if(el)el.scrollIntoView({behavior:"smooth",block:"start"})});
if($("filt-toggle"))$("filt-toggle").addEventListener("click",function(){var on=$("filt-body").classList.toggle("open");this.setAttribute("aria-expanded",on);this.classList.toggle("on",on)});
$("reset").addEventListener("click",function(){
  $("q").value="";$("kw").value="";
  ["minP","maxP","bumin","bumax","landmin","landmax"].forEach(function(k){$(k).value=""});
  $("ten").selectedIndex=0;$("furn").selectedIndex=0;$("bumi").selectedIndex=0;$("sort").selectedIndex=0;
  document.querySelectorAll(".chip.on").forEach(function(c){c.classList.remove("on")});
  [].forEach.call($("sr").children,function(c,i){c.classList.toggle("on",i===0)});
  [].forEach.call($("cat").children,function(c,i){c.classList.toggle("on",i===0)});
  showChips();run();
});
load();showChips();run();
})();
